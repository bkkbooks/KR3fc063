body:
  text: 次于兩弧心氐盡處各横穿圓孔一東西正對如右圖乃以晷體丙丁盡處兩横軸入之令晷體低昂任意如轆轤然用法定指南針查本方北極出地平高若干度各省北極高度見下第四法北極考次將晷體甲乙昂起乃數晷牀旁植兩弧之度自北之斗處數起至本方北極高度以長物爲支條入本度之孔而横貫于彼弧本度之孔以支晷令晷體爲支條所横格斜立向南則晷體斜度如本方北極高度而表端咸正指本方赤道矣若晷體稍厚則支條斷不可施于本度之孔必于其下一二度之孔斟酌用之須令晷厚體平分處與本度兩界線之中心一點相準否則晷體厚則晷面高于本度差毫釐失千里矣
  hash: sha256:05e4beee96b26cd72028b9bd2f8deb0d0d4f872bc3fc3ad59b7f7cb6efc7bd5d
