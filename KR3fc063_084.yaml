body:
  text: 指南針如角乃以晷體甲乙兩横軸入兩弧心氐之小圜孔若轆轤然令晷體低昂適意用法定指南針將晷體丙丁昂起次查本方赤道高若干度赤道高度考見上乃數晷牀旁植兩弧之度自南斗數起至本方赤道高度以長物爲支條入本度之孔而横貫于彼弧之孔以支晷令晷體爲支條所横格斜立向北則晷體斜度如本方赤道高度而晷上面之表指北極下面之表指南極也故自春分以後太陽行北緯則影見于上面而下面無影秋分以後太陽行南緯則影見于下面而上面無影若春秋分兩日太陽正𨇠赤道則上下二面皆無影矣
