body:
  text: 某限相距之度如第一限至二十二限之類既得尺度則定規勿令兩規張翕以便移其度入晷線也此以規就尺度令兩規相距之度如兩尺某限相距之度也尺定而規定於尺也次定二至日太陽各時刻距赤道緯度法曰以咸兌表度置尺十二限處為底定尺而取兩尺間六限下第二分之底移於晷線兌心之南與其北南北而各截之南如兌井北如兌夬乃于井夬作直線聯之與坎離線十字正交于兌心如下圖問井夬之義曰井即夏至日正午日影所到也夬即冬至日正午日影所到也問何以知其然也曰每日自東而西者太陽之經度也一年之中太陽半年在赤道南半年在赤道北其自北而南自南而北者太陽之緯度也緯度極北為夏至距赤道二十三度半緯度極南為冬至距赤道亦二十
  hash: sha256:a83868f3c548c5b076bc2fd4c02c2dce6e196aa45e5f80ded678c18636c6edf6
