body:
  text: 極考乃數晷牀弧度自南之斗數起至本方赤道高度將晷體上下斜轉之令晷體乾坤線恰當本度兩界線之中乃於乾坤線上作小孔洞之令與本度之孔準對以樞貫之則乾坤線如本方赤道而成正東日晷矣
