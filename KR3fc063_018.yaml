body:
  text: 十六限又四刻也滿半時矣即切線六十度十七限又一刻也即切線六十三度四十五分十八限又二刻也即切線六十七度半十九限又三刻也即切線七十一度十五分二十限又四刻也滿半時矣即切線七十五度二十一限又一刻也即切線七十八度四十五分二十二限又二刻也即切線八十二度半二十三限又三刻也即切線八十六度十五分若井亢線稍短秪容二十限或十八十九限則不足日晷時刻之用法將井亢線進移于右稍近斗牛線務令本線遇二十三限或遇二十二限不遇則再移近斗牛取之遇則止如角氐線此線務與右左之斗牛井亢線平行其長則如井亢線務與尺等士琳案原稿此下但注即用右圖可也六字而缺圖今據後文兩尺必等語故取前圖各線點
