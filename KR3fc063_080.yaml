body:
  text: 第六法斜立向正北正對北極之日晷此晷亦作于平面用時支之使向北斜立其斜度視各方赤道高下之度隨處可以通用法曰此晷不煩用尺但取方版為晷體北如甲乙南丙丁西丙甲東丁乙其甲乙盡處餘少許為兩橫軸晷體上下二面務極平正以版中心一點為晷心作大圜于方內平分圜周為九十六限其向北正中一線即正午也午右左四限為午初午正之四刻次右左四限為巳正未初之四刻次右左四限為巳初未正之四刻次辰正申初四刻次辰初申正四刻次卯正酉初四刻次卯初酉正四刻將各時刻挨次書于圜外版上其戌亥子丑寅五時日入地平影不能到毋庸排寫乃于晷心作小孔洞之務直毋曲直貫于下面中心之一點下面亦以孔為心作大圜亦平分為九十六限其向北正中一線亦正午也而其左右各時刻則皆與上面相反而逆旋如圖
  hash: sha256:5cc3bb12561c74e6d9e0e08dbb0b41ade470205bc00937f3ea51e24e0bb97882
