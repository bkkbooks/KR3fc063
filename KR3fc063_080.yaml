body:
  text: 第六法斜立向正北正對北極之日晷此晷亦作于平面用時支之使向北斜立其斜度視各方赤道高下之度隨處可以通用法曰此晷不煩用尺但取方版爲晷體北如甲乙南丙丁西丙甲東丁乙其甲乙盡處餘少許爲兩横軸晷體上下二面務極平正以版中心一點爲晷心作大圜于方內平分圜周爲九十六限其向北正中一線卽正午也午右左四限爲午初午正之四刻次右左四限爲巳正未初之四刻次右左四限爲巳初未正之四刻次辰正申初四刻次辰初申正四刻次卯正酉初四刻次卯初酉正四刻將各時刻挨次書于圜外版上其戌亥子丑寅五時日入地平影不能到毋庸排寫乃于晷心作小孔洞之務直毋曲直貫于下面中心之一點下面亦以孔爲心作大圜亦平分爲九十六限其向北正中一線亦正午也而其左右各時刻則皆與上面相反而逆旋如圖
  hash: sha256:8b7e378471c4b724720d71037f0b37493c08bbbaecaf2e3d31217b46f39fcb2a
