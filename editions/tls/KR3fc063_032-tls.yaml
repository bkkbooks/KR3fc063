body:
  text: 三度半南北兩緯相距四十七度故冬至日太陽在赤道南二十三度半爲太陽緯度之極南自此以後太陽以次漸移而北迨北行二十三度半而到赤道上是日爲春分旣過春分太陽漸離赤道而北又北行二十三度半而到緯度之極北是日爲夏至夏至日太陽在赤道北二十三度半爲太陽緯度之極北自此以後太陽以次漸移而南迨南行二十三度半而到赤道上是日爲秋分旣過秋分太陽漸離赤道而南又南行二十三度半而到緯度之極南是日爲冬至此太陽終歲行度之不易者也右法以表長當半徑半徑圓徑之半也卽下圖圓心至各弧界之度以十二限當四十五度之切線亦卽半徑也其六限下第二分卽二十三度半之切線故其度爲冬夏至日影所到也
