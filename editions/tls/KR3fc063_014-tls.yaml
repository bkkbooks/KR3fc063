body:
  text: 士琳案原稿因弧小以十二平分當二十四限今仍其舊又脫點作識今補次于斗牛線左作直線與斗牛線平行如井亢此線長與尺等次從斗心向弧各點作直線聯之每直線皆從斗心斜出過各限之點遇井亢直線而止惟斗牛線平行無度終古不能與井亢線相遇故斗牛毋庸出直線卽近斗牛一二線亦不必出直線至井亢線恐尺短不能容也或問井亢線之義曰卽割圓八線中之切線也切線九十度末度平行無度故只以八十九度立筭兹變爲二十四限末限平行無度故只以二十三限具尺每限當切線三度四十五分爲一刻
  hash: sha256:5b23c38234c2935f5a828c8400e4c36f5423d0a9a617936854aadd17b976da75
