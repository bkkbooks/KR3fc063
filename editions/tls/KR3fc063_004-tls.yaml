body:
  text: 日約加減十刻知日出入于辰正申初二刻也極出六十度則冬至日出入較兩分日約加減十六刻知日出入于巳未正初刻也俗所用晷不求極出度隨處通用嘻謬矣夫在天一度在地南北約二百里此緯度也若經度則天一度地東西約四百里矣考成云在天一度在地二百里厤家稱南行二百里則極低一度言緯度也方今地域廣輪從古無匹竊見疇人子弟推極出表自十餘度至六十餘度其差五十餘度顧執一成之器而概之薄海内外曰此其晷也豈但差毫釐而失千里已乎衡不敏以鄙意造筭尺一具專爲製晷設也乃製晷得六則一曰斜立向正南之日晷二曰斜立向正東之日晷三曰斜立向正西之日晷四曰平面向正北之日晷五曰立面向正南之日晷六曰斜立向正北之日晷晷式不雷同然其用北極以定赤道之高下以求景則區區主見所在六者毋或岐也具圖各附説其下説不文然不敢作晦澀語錄之成帙帙分上下卷上卷造尺法下卷則治晷法也南豐劉衡
  hash: sha256:ab05d9fa92d00b32ea22e427549ecf0357e208e16e5097e466bb1d9caa9ce4e3
