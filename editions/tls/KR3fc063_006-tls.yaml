body:
  text: 尺式西人謂之比例規規之云者兩尺張翕任意似畫圓之器也此乃質言尺作尺法用薄銅版或堅木作兩長尺扁方任長一尺上下廣約五分取足作線作點書字而已兩尺相並等長等廣無毫髮差然兩尺相並則無由相聯也乃于兩尺之一端近隅處多留餘地以隅爲心圓之其一圓頭與尺面平而空其中令空處之圓與尺面之圓相等如乾其一如坤則剡其圓頭上下二面俱剡令二面剡去之圓與乾尺中空之圓相等以相入密無罅也乃于尺
  hash: sha256:11888287d11219d82e0f29b92341699b122a73d1e651c85110cae996fcef9bf5
