body:
  text: 晷牀用薄片作象限弧二必等弧半徑度與晷體丙丁度等亦同丁乙弧平分九十度度皆從弧心氐斜出直線聯之皆作孔洞之孔當各度兩界線之中與弧線平行密排如齒如圖次用平版廣狹長短視晷體差豐亦横置之以兩弧斗氐就版氐南斗北植立版之兩端兩弧東西正對勿稍敧側其一以膠或釘固之其一安晷後乃固之版近北安指南車一具如角士琳案弧版與晷牀平行故原圖易作鈍角
