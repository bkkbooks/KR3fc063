body:
  text: 節氣何也曰太陽一日行一度十五日行十五度爲一節氣若六節氣則滿九十度矣日晷尺與切線同理切線無九十度平行無度終古不能與割線相遇故不立等不得已而用其半故以十二限之四十五度代九十度而所取各限亦俱用其半也第二限七度半以代十五度爲一節氣第四限十五度以代三十度爲二節氣第六限二十二度半以代四十五度爲三節氣第八限三十度以代六十度爲四節氣第十限三十七度半以代七十五度爲五節氣而十二限四十五度代九十度爲六節氣用半實用全法窮而巧法生矣問晷面各時刻線自赤道至二至皆二十三度半也何以又分爲九十度也曰太陽黃道周天三百六十度分爲四分每分九十度謂之象限一象限又分爲六分每分十五度爲一節氣太陽自冬至至春分春分至夏至夏至至秋分秋分至冬至每
  hash: sha256:0386ecc845ff1ec92c55f0ea3333f1023f10d326b8f191f2dbb2af2b5af0ca46
