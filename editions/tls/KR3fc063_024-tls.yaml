body:
  text: 作日晷六法第一法斜立向正南之日晷此晷作于平面用時支之使向南斜立其斜度視各方北極高下之度隨處可以通用先定時刻法曰作横線如坎離次于坎離横線中任定一點爲表位如兌兌作小孔以植表也次任取長數長約晷體九之一務直毋曲細長如鍼銳其兩端爲表如威恒表植于表位況兑其一端入兑之孔務直毋稍偏倚而表長如咸兑次以咸兑表度置尺十二限處爲底定尺勿令移動而取尺第一限至二十二限之各底以次移于坎離線兑點之左右左右自兑起以次蟬聯而至于坎離各作點識
  hash: sha256:b1ab25515f3503d7052b8de08574fb1f4a57bcdb3f9984bbfd0b378278814a78
