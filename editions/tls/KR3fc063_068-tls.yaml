body:
  text: 圈次引長咸艮線至于卯又作截腰横線于卯辰線十字正交于圖心如丑辰又于卯丑弧圜形似弓背之弧故曰弧艮辰弧之間斜作直線過心如申未次于卯辰弧艮丑弧之間亦斜作直線與申未線十字正交于圖心如巳丁夫大圜周天三百六十度也卯艮直線丑辰横線十字正交將大圈平分爲四分各得九十度卯辰弧艮辰弧卯丑弧艮丑弧皆九十度也丑辰爲地平卯爲天頂咸爲地心巳丁爲赤道申未爲北極申丑則北極出地平之高度申卯則北極高度之餘度也巳辰赤道出地平之度巳卯則赤道距天頂之度也赤道與北極相去必九十度相爲高低此高則彼低此低則彼高故北極出地平一度則赤道出地平必八十九度若如京師北極出地平四十度則京師赤道出地平必五十度故圜中四甲度皆等四乙度亦皆等此天道之不易者也咸丑也咸辰也咸卯也咸艮也咸
