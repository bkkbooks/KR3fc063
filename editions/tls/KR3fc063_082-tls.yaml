body:
  text: 乃作表表長短無定度銳其兩端以晷心小孔爲表位乃植表表穴孔而出于彼面令上下二面各得表之半晷牀用薄片作象限弧二必等弧半徑與晷體丙甲丁乙同等其作線作孔俱如第一法兩弧心氐盡處亦各横穿小圜孔俱如前法次用平版視晷體差大以兩弧氐斗就版斗南氐北植立版兩端兩弧東西正對毋稍敧側其一以膠或釘固之其一安晷後乃固之版近南安
