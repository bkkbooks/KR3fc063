body:
  text: 線故晷面赤道線直必中繩而是日日影所到亦終日不出此線餘節氣太陽出入于南北緯度故晷面之影不行直線近午則短而東西則漸弛也非用割線則不能求其影差各弦度者割線也右法表長恒爲句卽半徑也兌心至左右各時刻點爲股卽大圈外之切線也表端咸至各時刻點爲弦卽大圈外之割線兌井兌夬線以半徑表度當半徑十二限卽四五度亦半徑也而求二十三度半之度其餘各線則以割線各影弦度當半徑而求二十三度半之度故能遞求遞闊而得其影差也次定各節氣法曰以兌井之度用兌夬亦同置尺十二限處爲底定尺而取其第二限卽七度半之切線之底自兌心起向南兌井線加之作點識之亦自兌心起向北兌夬線加之作點識之北點卽驚蟄寒露日正午日影所到南點卽清明白露日正午日影所到也次卽原定尺取第
  hash: sha256:db875c47c7a9fcca34e77c8f0d6b5ed6fa84fd91021be8d7d4785f759dab12d8
