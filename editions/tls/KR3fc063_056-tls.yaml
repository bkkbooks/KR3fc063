body:
  text: 弧兩面作線必等士琳案原稿晷牀文一段本在圖後故末云如右圖今因所空之行太狹難容晷圖地位故移圖在文後而改右圖爲後圖次用平版長與弧氐斗等廣視長稍殺或等乃以弧氐斗就版斗南氐北植立版中央以膠或釘固之勿令敧側弧之東或西安指南車一具乃于弧心氐作小圓孔洞之以晷體坤端小圓軸入之如轆轤然用法定指南針查本方赤道高若干度赤道高度同北極餘度見第四法北
  hash: sha256:ef040c9042ce42d562fcb893f557455134f3f9b3e5be9ac9a2fc2af1872bea90
