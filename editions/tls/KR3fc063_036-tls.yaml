body:
  text: 右巳左申初點當股乃以咸至右巳左申初點之弦度置尺十二限爲底定尺其取底移于晷面巳申初點處上下截之作線聯之悉如前法卽二至日巳申初日影所到也自是右左而辰申正而卯酉正皆用咸兌句而以兌心至各時刻點當股以表端咸至各時刻點處之弦度爲十二限之底其取底截點作線悉同前井夬法惟右左自巳未正而右左影度漸長點線漸寬若能以細分之各刻與咸兌表長爲句股而各取其弦度爲底以求緯度則可得二至日各刻之日影所到也如圖幅短借作直圖須横觀之問二至日正午以外不用表度而用各弦度爲底有説乎曰天體渾圓日晷則寫渾于平者也故必有影差何也太陽惟二分日正𨇠赤道腰圍之一
  hash: sha256:e0a0ebf190139649887c16639c11a8c3d77d9b269d387b7c3daf571e3ee057f5
