body:
  text: 第五法立面向正南之日晷並同第四法但所定艮兌之距于本方北極餘度之底取之所定艮巽之度于本方北極高度之底取之蓋以北極高度定晷心以北極餘度定表位爲稍異耳又其時刻逆旋與第四法相反也
