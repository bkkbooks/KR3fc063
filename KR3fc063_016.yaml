body:
  text: 每四限當切線十五度為半時兹詳譜之如左第一限即一刻也即切線三度四十五分二限即二刻也即切線七度半三限即三刻也即切線十一度十五分四限即四刻也滿半時矣即切線十五度五限又一刻也即切線十八度四十五分六限又二刻也即切線二十二度半七限又三刻也即切線二十六度十五分八限又四刻也滿半時矣即切線三十度九限又一刻也即切線三十三度四十五分十限又二刻也即切線三十七度半十一限又三刻也即切線四十一度十五分十二限又四刻也滿半時矣即切線四十五度十三限又一刻也即切線四十八度四十五分十四限又二刻也即切線五十二度半十五限又三刻也即切線五十六度十五分
