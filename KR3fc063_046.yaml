body:
  text: 一象限各行九十度各有六節氣此太陽行黃道之經度也而其行赤道之緯度則非九十度也則仍不出二十三度半也何也九十度者黃道自東而西之度而二十三度半者黃道與赤道相距南北之度也問以九十度六節氣加于晷面南北緯線何以不挨次蟬聯而必逐次皆自兌心起度也曰天體渾圓而非平圓故太陽所𨇠緯度可以平算而不可以平視平測自春分至清明自秋分至寒露日行黃道經度十五度而其緯度則非十五度乃六度十九分也自立夏至小滿自立冬至小雪日行黃道經度亦十五度而其緯度乃四度也自芒種至夏至自大雪至冬至日行黃道經度亦十五度而其緯度則一度弱也蓋太陽近二分日其差多近二至日其差少故所取各限之底必自兌心起度而纍加之也
  hash: sha256:7b743f348979ba96dd421418fd3fcfd9c06724c093029068af5e8430c4735a01
