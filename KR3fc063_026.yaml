body:
  text: 之每一點爲一刻卽得午前午後各刻如圖若晷體窄小則近午難容密點法並取二限爲一點則每點爲二刻或併取四限爲一點則每點爲半時然自巳未正而右左爲限漸寬仍析取每限爲是問其義云何曰坎離線卽赤道也每年春秋分兩
