body:
  text: 之每一點為一刻即得午前午後各刻如圖若晷體窄小則近午難容密點法並取二限為一點則每點為二刻或併取四限為一點則每點為半時然自巳未正而右左為限漸寬仍析取每限為是問其義云何曰坎離線即赤道也每年春秋分兩
