body:
  text: 次于兑點左右引長之作橫線如坎離與乾坤直線十字正交于兑如圖士琳案圖漏坎離字今補問坎離去何曰即赤道也即春秋分曰日影所到也次以表長咸艮當句以艮兑當股而取其弦度咸兑置尺十二限為底定尺而取其自第一限至二十二限之各底次第移于坎離橫線兌點之左右右左自兌起蟬聯而至于坎離而各識之乃自晷心巽向各識處斜出直線聯之即得午前午後各時刻如右圖兌左右各時刻詳見第一法問咸艮表曰半徑也問艮兌曰北極高度之正切線也問艮巽曰北極高度之餘切線也何以知其然也曰試以咸為心艮為界作卯辰丑艮大
  hash: sha256:44c4556e731e02113925000e60553d19cfb3cc66c223ded139bfa8b2e6dde505
