body:
  text: 限所不備者則于相近之限上下斟酌取之之底移于乾坤線自表位艮向北截之作識于艮北如兌為艮兌次即原定尺取本方北極高度之餘度如浙江北極餘度六十度在尺第十二限之類若其度為尺各限所不具者則于相近之限上下斟酌取之之底亦移于乾坤線自表位艮向南截之作識于艮南如巽即晷心也為艮巽問北極高度餘度云何曰高度者北極出地平之度也餘度者北極距天頂之度也餘者對正之稱周天大圜三百六十度四平分之每分九十度即地平至天頂之度也故北極出地平一度其餘度必八十九度北極出地平二度其餘度必八十八度正盈一度則餘必絀一度正絀一度則餘必盈一度正餘相為盈絀并之必滿九十度故即正可以知餘即餘可以知正也
  hash: sha256:b83c8c4433dbfd43a6d361d92162a61b2c41866fb7619dfbd865f737435a0957
