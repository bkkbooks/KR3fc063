body:
  text: 又曰日南行而影則見于北日北行而影則見于南日晷者取影之器也故晷面井位南而其日影所到非南緯冬至乃北緯夏至也夬位北而其日影所到非北緯夏至乃南緯冬至也圖則畫日道所𨇠晷則畫日影所到故其南北相反也次以咸兌表長當句而以兌心至右午初點當股兌心至左未初點亦同乃以表端咸至右午初點之弦度咸至左未初之弦度亦同置尺十二限爲底定尺而取尺六限下第二分之底移于晷面午初點處于其點之上下截之亦移于未初點處亦于其上下截之各如截井夬法亦各作直線聯之而皆與井夬線平行卽二至日午初未初日影所到也次仍以咸兌表長當句而以兌心至右巳左未正點當股乃以表端咸至右巳左未正點之弦度置尺十二限爲底定尺其取底移于晷面巳未正點處上下截之作線聯之悉如前法卽二至日巳未正日影所到也次仍用咸兌句而以兌心至
