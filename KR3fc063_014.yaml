body:
  text: 士琳案原稿因弧小以十二平分當二十四限今仍其舊又脫點作識今補次于斗牛線左作直線與斗牛線平行如井亢此線長與尺等次從斗心向弧各點作直線聯之每直線皆從斗心斜出過各限之點遇井亢直線而止惟斗牛線平行無度終古不能與井亢線相遇故斗牛毋庸出直線即近斗牛一二線亦不必出直線至井亢線恐尺短不能容也或問井亢線之義曰即割圓八線中之切線也切線九十度末度平行無度故只以八十九度立算兹變為二十四限末限平行無度故只以二十三限具尺每限當切線三度四十五分為一刻
  hash: sha256:9eec3cb174a2b4eed2a2f1f69af9f12df8ccd22e0b8161baa82abd037b111a3b
