body:
  text: 北極高度之餘切卯寅必等而咸巽餘割與北極高度之餘割卯寅亦無不等也然則晷用艮兌實用子丑也晷用咸兌實用咸子也晷用艮巽實用卯寅也玩圖自明又論曰赤道高低隨各方北極之高低為轉移故北極度高則赤道低低則艮兌之距遠艮巽之距近而咸艮表宜短若北極度低則赤道高高則艮兌之距近艮巽之距遠而咸艮表宜長故表之長短表位及晷心之遠近必準乎北極之高下然後赤道有定位而春秋分兩日日𨇠赤道表端之割線乃終日指坎離赤道線上矣各省北極出地度赤道高度考北極餘度與赤道高度同北極出地度赤道高度京師四十度五十度盛京四十二度四十八度山西三十八度五十二度
  hash: sha256:cd0fb90e87e6c42a6f1cddebb89537ce5afdf7e2f0ef35a63d052668a1e3f893
