body:
  text: 併入尺式以補之又按日晷定各節氣須取太陽緯度二十三度半為冬至夏至日日影所到內本尺各限無二十三度半之度須添設此線法將女牛弧上第七限第八限并之而平分為十五分士琳案自第六限起至第八限止即為第七限第八限今以一平分當兩限應于女牛弧上自第三線點至第四線點之中又平分十五分也其第六限下之第二分即二十三度半也作點識之亦自斗心斜出直線遇弧本限之點而至角氐線問何以知第六限下第二分之確為二十三度半也曰第六限二十二度半也而第八限則三十度也每限三度四十五分併七八兩限得七度半倍
  hash: sha256:e3aaf5e6e5d8f32cb2b424a9a0ba30d33f543ed44a413830a215c966b087776e
