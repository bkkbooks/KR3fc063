body:
  text: 日太陽正𨇠赤道日影終日行此線上表端咸點所指之某限即是日某時某刻也兌即赤道之心故二分日正午則咸兌表直立正對太陽中心一點而無表影也又曰太陽射之弦割線影也而其影度之見于平面則切線也十二限者切線之四十五度也半徑也尺上各限即切線各度也以表度置尺十二限為底是以表度者半徑也以表度當半徑而取其切線以定時刻此恆理也問以某度為底者何也曰此定尺之法也以規兩鋭張翕之量定某長短之度如咸兌表度之類乃定規勿令兩規張翕乃張尺以規度施于兩尺之某限如十二限之類將兩尺張翕之以就規度既得規度則定尺勿令兩尺張翕此以尺就規度令兩尺某限相距之度如兩規相距之度也規定而尺定于規也問取某限為底何也曰此取兩尺各限之度之法也兩尺既定矣乃以規兩鋭張翕之量定兩尺間
