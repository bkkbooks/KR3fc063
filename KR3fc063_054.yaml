body:
  text: 為巳初之四刻次四點為巳正之四刻又次為午初此春秋分日各時刻日影所到也若晷小近卯處難容密線則併取二限為一點或併取四限為一點次定二至日各時刻太陽距赤道緯度次定各節氣悉同前第一法但彼分左右此則自上而下耳晷體長方剡其下坤端綴小圓釘如軸以入晷牀弧心氐小孔也晷牀用薄片作象限弧一弧平分九十度度皆從弧心氐斜出直線聯之皆作小孔洞之孔當兩界線之中與弧線平行密排如齒如後圖
  hash: sha256:1301e7a8b5422f606ed5e8b8a325c9926b1958567d42f67f9dc4fd633e166ebc
