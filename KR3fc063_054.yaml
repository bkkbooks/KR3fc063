body:
  text: 爲巳初之四刻次四點爲巳正之四刻又次爲午初此春秋分日各時刻日影所到也若晷小近卯處難容密線則併取二限爲一點或併取四限爲一點次定二至日各時刻太陽距赤道緯度次定各節氣悉同前第一法但彼分左右此則自上而下耳晷體長方剡其下坤端綴小圓釘如軸以入晷牀弧心氐小孔也晷牀用薄片作象限弧一弧平分九十度度皆從弧心氐斜出直線聯之皆作小孔洞之孔當兩界線之中與弧線平行密排如齒如後圖
