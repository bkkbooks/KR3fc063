body:
  text: 申咸巳咸未咸丁也各得大圜徑之半故曰半徑凡自圜心出線至弧界皆為半徑即皆句也若無圜內之正弦為句股則半徑又為弦其出圜外而與切線相遇者曰割線割線有二與正切相遇者曰正割與餘切相遇者曰餘割正割也餘割也皆弦也圜外截圜之線其直與卯艮線平行橫與丑辰線平行而相遇于割線者曰切線切線亦有二一曰正切一曰餘切二線互為正餘此為正則彼為餘彼為正則此為餘割線亦然正切也餘切也皆股也圓內弦線亦為股句股為正方角無論巨細但同弦則反正順逆其形必兩兩相等故可以互求此算理之不易者也如右圖咸艮表上指天頂下至地心即咸卯也亦即咸丑也艮為表位咸艮兌句股形與咸丑子形等故艮兌正切與北極高度之正切子丑必等而咸兌正割與北極高度之正割咸子亦無不等也巽為晷心咸艮巽句股形與咸卯寅形等故艮巽餘切與
