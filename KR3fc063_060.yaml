body:
  text: 第三法斜立向正西之日晷説同前此晷作法同第二法但面向正西故其時刻次序皆逆行自下而上第一點乾即酉初三刻交正也次酉初二刻次酉初一刻次酉初初刻自是而下為申正為申初為未正為未初為午末又其節氣惟中一線春分秋分同第二法餘俱與第二法相反如彼為冬至此為夏至彼為芒種小暑此為大雪小寒之類至晷牀用法俱同第二法但彼向正東故晷體安于弧之東面此向正西故晷體安于弧之西面耳圖同第二法
  hash: sha256:acab2ac32c84ddc8f7c14cf42bde0fa7642b12fb72f9b491eeccf1cfce0bde97
