body:
  text: 第三法斜立向正西之日晷説同前此晷作法同第二法但面向正西故其時刻次序皆逆行自下而上第一點乾卽酉初三刻交正也次酉初二刻次酉初一刻次酉初初刻自是而下爲申正爲申初爲未正爲未初爲午末又其節氣惟中一線春分秋分同第二法餘俱與第二法相反如彼爲冬至此爲夏至彼爲芒種小暑此爲大雪小寒之類至晷牀用法俱同第二法但彼向正東故晷體安于弧之東面此向正西故晷體安于弧之西面耳圖同第二法
