body:
  text: 衡少讀周官經土圭測日攷工記置𣙗以懸眡以景懵然不得其解既於家藏故纸中得泰西比例規解一編年來走京師遊觀象臺獲睹儀象諸巨製伏讀御製厤象考成上下二編乃始窺太陽經緯躔度夫北極者距赤道九十度者也此亙古不易者也惟天體渾圜而非平圜北極出地隨方不同有表見下二卷故日度所躔與日景所到亦遂有因地高下之異而晝夜之長短因之極與平地齊之處每晝夜必平分雖冬至亦同春秋雨分日日出入在卯酉正初刻若極出十度則冬至日出入較两分日約加減一刻半知日出入于卯正酉初一二刻半也極出二十度則冬至日出入較兩分日約加減二刻半知日出入于卯正二酉初一刻半也極出三十度則冬至日出入較兩分日約加減四刻知日出入于辰酉初初刻也極出四十度則冬至日出入較兩分日約加減六刻知日出入于辰初申正二刻也極出五十度則冬至日出入較兩分
