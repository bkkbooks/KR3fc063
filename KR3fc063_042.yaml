body:
  text: 底以次皆自本線之心起向南亦向北加之作點識之悉同上兌井夬線求各節氣法正午左右各時刻線均定節氣訖乃于各線點識處各作橫線聯之次于各橫線兩端盡處將各節氣以次書之如右圖士琳案此段原稿在圖前今移于圖後故于圖上增一右字晷體橫寬北甲乙南丙丁西丙甲東丁乙廣狹長短無定度取足畫線書字而已丙丁盡處各餘少許為橫軸以入晷牀兩弧心氐小孔也問尺十二限即切線之四十五度也今分之為六
  hash: sha256:7bbf0bcb7e635216edbd0d51775216aa4a3b8c84c4e506fdeab8a7d786d1395a
