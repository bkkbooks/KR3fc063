body:
  text: 四限即十五度之切線之底自兌心起南北向兌井夬線上加之作點識之北南點即雨水霜降穀雨處暑日正午日影所到也次即原定尺取第六限即二十二度半之切線之底自兌心起南北向兌井夬線上加之作點識之北南點即立春夏立冬秋日正午日影所到也次即原定尺取第八限即三十度之切線之底自兌心起南北向兌井夬線上加之作點識之北南點即小雪大寒小滿大暑日正午日影所到也次取原定尺取第十限即三十七度半之切線之底自兌心起南北向兌井夬線之上加之作點識之北南點即大雪小寒芒種小暑日正午日影所到也右所定節氣二十皆本日正午日影所到也合之兌心為春分秋分井為夏至夬為冬至則正午二十四節氣全矣井夬正午線之左之右各時刻線其定節氣之法皆以本線之半或用赤道南半線或用赤道北半線之度置尺十二限處為底定尺而遞取其第二限四限六限八限十限各
